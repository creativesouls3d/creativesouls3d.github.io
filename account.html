<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Account | Creative Souls 3D</title>

  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script defer src="account.js"></script>
</head>

<body>
  <header>
    <button class="back-nav" type="button" data-back data-fallback="index.html">&larr; Back</button>
    <div class="logo-section">
      <img src="logo_creativesouls.jpg" alt="Creative Souls 3D Logo" />
      <span>Creative Souls 3D</span>
    </div>
    <nav class="cart-link" aria-label="Main navigation">
      <a href="index.html">Shop</a>
      <a href="orders.html">Orders</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main>
    <section class="account-section">
      <h1>Your Profile</h1>
      <p>Keep your delivery details updated for quicker checkout.</p>

      <form id="profile-form">
        <label>
          Name
          <input type="text" id="name" required />
        </label>

        <label>
          Address
          <textarea id="address" rows="3" required></textarea>
        </label>

        <label>
          Phone
          <input type="tel" id="phone" required pattern="[0-9]{10}" />
        </label>

        <button type="submit">Save Profile</button>
      </form>

      <p id="status" style="text-align:center;color:#2f7d68;margin-top:10px;font-weight:800;"></p>
    </section>
  </main>

  <footer>
    <p>Creative Souls 3D &copy; 2026</p>
  </footer>
  <script src="navigation.js"></script>
</body>
</html>

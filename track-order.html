<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Track Order | Creative Souls 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="logo_creativesouls.jpg">
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Header -->
  <header>
    <button class="back-nav" type="button" data-back data-fallback="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back
    </button>
    <div class="logo-section" onclick="window.location.href='index.html'">
      <img src="logo_creativesouls.jpg" alt="Creative Souls 3D Logo" />
      <span>Creative Souls <strong>3D</strong></span>
    </div>
    <nav class="cart-link" aria-label="Main navigation">
      <a href="index.html" class="nav-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Shop
      </a>
      <a href="orders.html" class="nav-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        Orders
      </a>
      <a href="cart.html" class="nav-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Cart
        <span class="cart-badge" id="cart-badge">0</span>
      </a>
    </nav>
  </header>

  <main class="track-shell">
    <div id="track-info"></div>
  </main>

  <!-- Footer -->
  <footer>
    <p>Creative Souls 3D &copy; 2026 &bull; Personalized 3D Printed Art, Gifts & Keepsakes</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="navigation.js"></script>

  <script>
    function formatPrice(value) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      }).format(Number(value || 0));
    }

    function escapeHTML(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeOrderId(value) {
      const cleaned = String(value || "").trim().replace(/^#/, "");
      return cleaned ? `#${cleaned}` : null;
    }

    function getOrderId() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      return normalizeOrderId(id);
    }

    function showTrackForm(message = "") {
      const container = document.getElementById("track-info");
      container.innerHTML = `
        <div class="track-card">
          <form id="track-form" class="track-form">
            <div style="margin-bottom: 8px;">
              <span class="eyebrow" style="margin-bottom: 12px;">Live 3D Print Stepper</span>
              <h1>Track Your Order</h1>
              <p>Enter your 6-digit Order ID to check your 3D print progress and delivery dispatch.</p>
            </div>
            <div class="track-input-row">
              <input id="order-id-input" type="text" placeholder="e.g. 253751 or #253751" autocomplete="off" required />
              <button type="submit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Track
              </button>
            </div>
            ${message ? `<p id="track-message" style="color: var(--danger); font-weight: 700;">${escapeHTML(message)}</p>` : ""}
          </form>
        </div>
      `;

      document.getElementById("track-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const orderId = normalizeOrderId(document.getElementById("order-id-input").value);

        if (!orderId) {
          const msgEl = document.getElementById("track-message");
          if (msgEl) msgEl.textContent = "Please enter an order ID.";
          return;
        }

        const cleanId = orderId.replace("#", "");
        window.history.replaceState(null, "", `track-order.html?id=${encodeURIComponent(cleanId)}`);
        loadOrder(orderId);
      });
    }

    function maskPhone(phone) {
      if (!phone || phone.length < 4) return phone || "-";
      return phone.slice(0, 2) + "XXXXXX" + phone.slice(-2);
    }

    function getProgressIndex(status) {
      if (!status) return 0;
      const normalized = String(status).toLowerCase();
      if (normalized.includes("placed")) return 0;
      if (normalized.includes("approved")) return 1;
      if (normalized.includes("rejected")) return 1;
      if (normalized.includes("printing")) return 2;
      if (normalized.includes("delivery") && !normalized.includes("delivered")) return 3;
      if (normalized.includes("delivered")) return 4;
      return 0;
    }

    async function loadOrder(orderId = getOrderId()) {
      const container = document.getElementById("track-info");

      if (!orderId) {
        showTrackForm();
        return;
      }

      container.innerHTML = `
        <div class="empty-state">
          <p style="font-weight: 700;">Loading order details for ${escapeHTML(orderId)}...</p>
        </div>
      `;

      try {
        const doc = await db.collection("orders").doc(orderId).get();

        if (!doc.exists) {
          showTrackForm(`Order ${orderId} not found. Please verify the ID and try again.`);
          return;
        }

        const data = doc.data();
        const statusText = data.status ? data.status.toLowerCase() : "";
        const currentStep = getProgressIndex(statusText);
        const isRejected = statusText.includes("rejected");
        const isWaitingPayment = String(data.payment_status || "").toLowerCase() === "pending";
        const steps = ["Order Placed", "Order Approved", "Printing Product", "Put For Delivery", "Product Delivered"];

        let stepsHTML = "";

        steps.forEach((step, index) => {
          let className = "";
          if (isRejected) {
            if (index <= 1) className = "rejected";
          } else if (index < currentStep) {
            className = "completed";
          } else if (index === currentStep) {
            className = "active";
          }

          stepsHTML += `
            <div class="step ${className}">
              <div class="circle">${index + 1}</div>
              <span>${step}</span>
            </div>
          `;
        });

        const progressWidth = (currentStep / (steps.length - 1)) * 100;
        let itemsHTML = "";

        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            itemsHTML += `
              <div class="order-item-row" style="margin-bottom: 8px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                  <img src="${escapeHTML(item.imageUrl || 'logo_creativesouls.jpg')}" alt="${escapeHTML(item.productName || 'Product')}" style="width: 44px; height: 44px; border-radius: var(--radius-sm); object-fit: contain; background: #ffffff; border: 1px solid var(--border); padding: 4px;" />
                  <div>
                    <strong>${escapeHTML(item.productName || "Untitled product")}</strong>
                    ${item.colour ? `<span>Colour: ${escapeHTML(item.colour)}</span>` : ""}
                    <span>Quantity: ${item.quantity} &times; ${formatPrice(item.price)}</span>
                  </div>
                </div>
                <strong>${formatPrice(Number(item.quantity || 0) * Number(item.price || 0))}</strong>
              </div>
            `;
          });
        }

        const placedOn = data.timestamp ? data.timestamp.toDate().toLocaleString("en-IN", {
          dateStyle: "medium",
          timeStyle: "short"
        }) : "-";

        container.innerHTML = `
          <div class="track-card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px;">
              <div>
                <h1 style="margin: 0;">Order ${escapeHTML(data.order_id || "")}</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Placed on ${escapeHTML(placedOn)}</p>
              </div>
              <div class="order-status ${
                isRejected ? "danger" :
                statusText.includes("delivered") || statusText.includes("approved") ? "success" :
                statusText.includes("printing") || statusText.includes("delivery") ? "active" :
                "pending"
              }">${escapeHTML(data.status || "Processing")}</div>
            </div>

            ${isWaitingPayment ? `
              <div style="padding: 14px 18px; background: var(--warning-bg); border: 1px solid #fde68a; border-radius: var(--radius-md); color: #92400e; font-weight: 700; margin-bottom: 20px;">
                We’ve received your order details. Your UPI payment is awaiting verification; we’ll update the order status once it is verified.
              </div>
            ` : ""}

            <div class="progress-container">
              <div class="progress ${isRejected ? "rejected-bar" : ""}"
                   style="${isRejected ? "" : "width:" + progressWidth + "%"}"></div>
              ${stepsHTML}
            </div>

            <div class="order-detail-grid" style="margin-top: 32px;">
              <article class="order-panel">
                <h2>Shipping & Contact</h2>
                <dl class="detail-list">
                  <div><dt>${data.fulfillment_type === "pickup" ? "Pickup Update" : "Expected Delivery"}</dt><dd style="color: var(--brand-dark); font-weight: 800;">${escapeHTML(data.expected_delivery || "Will be updated after payment")}</dd></div>
                  <div><dt>Contact Phone</dt><dd>${escapeHTML(maskPhone(data.phone || ""))}</dd></div>
                  <div><dt>${data.fulfillment_type === "pickup" ? "Pickup Location" : "Delivery Address"}</dt><dd>${escapeHTML(data.pickup_location || data.address || "-")}</dd></div>
                </dl>
              </article>

              <article class="order-panel">
                <h2>Payment Summary</h2>
                <dl class="detail-list">
                  <div><dt>Payment Mode</dt><dd>${escapeHTML(data.payment_ref || "Cash on Delivery")}</dd></div>
                  <div><dt>Items Subtotal</dt><dd>${formatPrice(data.item_total)}</dd></div>
                  <div><dt>Delivery Charge</dt><dd>${formatPrice(data.delivery_charge)}</dd></div>
                  ${Number(data.discount || 0) > 0 ? `<div><dt>Discount</dt><dd style="color: var(--accent-emerald);">-${formatPrice(data.discount)}</dd></div>` : ""}
                  <div><dt>Total Amount</dt><dd style="font-size: 1.2rem; font-weight: 900; color: var(--text-primary);">${formatPrice(data.total)}</dd></div>
                </dl>
              </article>
            </div>

            <section class="order-panel" style="margin-top: 20px;">
              <h2>Products in Order</h2>
              <div class="order-items-list">
                ${itemsHTML || "<p style='color: var(--text-muted);'>No items found.</p>"}
              </div>
            </section>

            <div style="margin-top: 24px; text-align: center;">
              <button onclick="showTrackForm()" class="nav-pill" style="color: var(--text-primary); border-color: var(--border); background: var(--surface-alt); margin: 0 auto;">
                🔍 Track Another Order
              </button>
            </div>
          </div>
        `;

        if (window.innerWidth <= 640 && !isRejected) {
          const progress = document.querySelector(".progress");
          if (progress) progress.style.height = progressWidth + "%";
        }
      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="empty-state">
            <p style="color: var(--danger); font-weight: 700;">Error retrieving order tracking info. Please try again.</p>
          </div>
        `;
      }
    }

    loadOrder();
  </script>
  <script src="site-footer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Track Order - Creative Souls 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #eef2ff, #f9fbff);
      padding: 20px;
      color: #222;
    }

    .container { max-width: 900px; margin: auto; }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      margin-top: 20px;
    }

    h2 { margin-top: 0; }

    .status-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .approved { background: #e6f7ee; color: #1e9e57; }
    .rejected { background: #ffe9e9; color: #d63031; }
    .pending { background: #fff4d6; color: #e67e22; }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 25px 0;
    }

    .label { font-weight: 600; color: #555; }

    ul { padding-left: 20px; }
    li { margin-bottom: 12px; }

    /* ===== DESKTOP PROGRESS ===== */

    .progress-container {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 40px 0;
    }

    .progress-container::before {
      content: '';
      position: absolute;
      top: 21px;
      left: 0;
      width: 100%;
      height: 4px;
      background: #eee;
      z-index: 0;
    }

    .progress {
      position: absolute;
      top: 21px;
      left: 0;
      height: 4px;
      background: #4b7bec;
      z-index: 1;
      transition: width 0.6s ease;
    }

    .progress.rejected-bar {
      background: #d63031 !important;
      width: 100% !important;
    }

    .step {
      position: relative;
      width: 20%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #777;
      transition: 0.3s ease;
    }

    .step.completed .circle {
      background: #20bf6b;
      color: white;
    }

    .step.active .circle {
      background: #4b7bec;
      color: white;
    }

    .step.rejected .circle {
      background: #d63031;
      color: white;
    }

    .step span {
      margin-top: 10px;
      font-size: 12px;
    }

    /* ===== MOBILE TIMELINE ===== */

    @media (max-width: 768px) {

      .progress-container {
        flex-direction: column;
        align-items: flex-start;
      }

      .progress-container::before {
        top: 0;
        left: 21px;
        width: 4px;
        height: 100%;
      }

      .progress {
        top: 0;
        left: 21px;
        width: 4px !important;
        height: 0;
        transition: height 0.6s ease;
      }

      .progress.rejected-bar {
        height: 100% !important;
      }

      .step {
        width: 100%;
        flex-direction: row;
        align-items: center;
        margin-bottom: 30px;
      }

      .circle {
        margin-right: 15px;
      }

      .step span {
        margin-top: 0;
        font-size: 14px;
      }
    }

    .error, .loading {
      text-align: center;
      margin-top: 60px;
      font-weight: 600;
    }

    .error { color: red; }
  </style>
</head>

<body>

<div class="container">
  <div id="track-info" class="loading">Loading order details...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>

<script>
  function getOrderId() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    return id ? `#${id}` : null;
  }

  function maskPhone(phone) {
    if (!phone || phone.length < 4) return phone;
    return phone.slice(0, 2) + "XXXXXX" + phone.slice(-2);
  }

  function getProgressIndex(status) {
    if (!status) return 0;
    status = status.toLowerCase();

    if (status.includes("placed")) return 0;
    if (status.includes("approved")) return 1;
    if (status.includes("rejected")) return 1;
    if (status.includes("printing")) return 2;
    if (status.includes("delivery") && !status.includes("delivered")) return 3;
    if (status.includes("delivered")) return 4;

    return 0;
  }

  async function loadOrder() {
    const container = document.getElementById("track-info");
    const orderId = getOrderId();

    if (!orderId) {
      container.innerHTML = "<p class='error'>Invalid Order ID</p>";
      return;
    }

    try {
      const doc = await db.collection("orders").doc(orderId).get();

      if (!doc.exists) {
        container.innerHTML = "<p class='error'>Order not found</p>";
        return;
      }

      const data = doc.data();
      const currentStep = getProgressIndex(data.status);
      const isRejected = data.status.toLowerCase().includes("rejected");

      const steps = [
        "Order Placed",
        "Order Approved",
        "Printing Product",
        "Put For Delivery",
        "Product Delivered"
      ];

      let stepsHTML = "";
      steps.forEach((step, index) => {
        let className = "";

        if (isRejected) {
          if (index <= 1) className = "rejected";
        } else {
          if (index < currentStep) className = "completed";
          else if (index === currentStep) className = "active";
        }

        stepsHTML += `
          <div class="step ${className}">
            <div class="circle">${index + 1}</div>
            <span>${step}</span>
          </div>
        `;
      });

      const progressWidth = (currentStep / (steps.length - 1)) * 100;

      container.innerHTML = `
        <div class="card">
          <h2>Order ${data.order_id}</h2>

          <div class="status-badge ${
            isRejected ? "rejected" :
            data.status.toLowerCase().includes("approved") ? "approved" :
            "pending"
          }">
            ${data.status}
          </div>

          <div class="progress-container">
            <div class="progress ${isRejected ? "rejected-bar" : ""}" 
                 style="${isRejected ? "" : "width:" + progressWidth + "%"}"></div>
            ${stepsHTML}
          </div>

          <p><span class="label">Placed on:</span>
          ${data.timestamp.toDate().toLocaleString()}</p>

          <hr>

          <p><span class="label">Phone:</span>
          ${maskPhone(data.phone)}</p>

          <p><span class="label">Delivery Address:</span>
          ${data.address}</p>

          <hr>

          <p><span class="label">Total:</span> ₹${data.total}</p>
        </div>
      `;

      // Mobile vertical height animation
      if (window.innerWidth <= 768 && !isRejected) {
        const progress = document.querySelector(".progress");
        progress.style.height = progressWidth + "%";
      }

    } catch (error) {
      console.error(error);
      container.innerHTML = "<p class='error'>Error loading order.</p>";
    }
  }

  loadOrder();
</script>

</body>
</html>

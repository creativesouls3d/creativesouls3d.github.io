<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Track Order | Creative Souls 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    .track-shell {
      max-width: 920px;
      margin: 42px auto 72px;
      padding: 0 16px;
    }

    .track-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(20px, 4vw, 32px);
      box-shadow: var(--shadow);
    }

    .track-form {
      display: grid;
      gap: 16px;
      max-width: 560px;
      margin: 0 auto;
    }

    .track-form p {
      color: var(--muted);
    }

    .track-input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .track-input-row input {
      min-height: 46px;
      padding: 11px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      outline: none;
    }

    .track-input-row input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(243, 198, 35, 0.18);
    }

    .track-input-row button {
      padding: 10px 18px;
      background: var(--brand);
      border: none;
      border-radius: var(--radius);
      color: var(--ink);
      cursor: pointer;
      font-weight: 900;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 12px;
      border-radius: var(--radius);
      font-weight: 800;
      margin: 10px 0 24px;
    }

    .approved { background: #e6f5ee; color: #19734d; }
    .rejected { background: #ffe9e4; color: #b83224; }
    .pending { background: #fff4d1; color: #8b6200; }

    .progress-container {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 38px 0;
    }

    .progress-container::before,
    .progress {
      content: "";
      position: absolute;
      top: 21px;
      left: 0;
      height: 4px;
      border-radius: 999px;
    }

    .progress-container::before {
      width: 100%;
      background: var(--line);
      z-index: 0;
    }

    .progress {
      background: var(--accent);
      z-index: 1;
      transition: width 0.45s ease;
    }

    .progress.rejected-bar {
      width: 100% !important;
      background: var(--danger);
    }

    .step {
      position: relative;
      width: 20%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 2;
      color: var(--muted);
      font-weight: 700;
    }

    .circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--soft);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: var(--muted);
    }

    .step.completed .circle,
    .step.active .circle {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .step.rejected .circle {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .step span {
      margin-top: 10px;
      font-size: 0.82rem;
    }

    .label {
      font-weight: 800;
      color: var(--muted);
    }

    .loading,
    .error {
      text-align: center;
      color: var(--muted);
      font-weight: 800;
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 768px) {
      .progress-container {
        flex-direction: column;
        align-items: flex-start;
        gap: 26px;
      }

      .progress-container::before,
      .progress {
        top: 0;
        left: 21px;
        width: 4px !important;
        height: 100%;
      }

      .progress {
        height: 0;
      }

      .progress.rejected-bar {
        height: 100% !important;
      }

      .step {
        width: 100%;
        flex-direction: row;
        text-align: left;
      }

      .circle {
        margin-right: 14px;
        flex: 0 0 auto;
      }

      .step span {
        margin-top: 0;
        font-size: 0.95rem;
      }

      .track-input-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <button class="back-nav" type="button" data-back data-fallback="index.html">&larr; Back</button>
    <div class="logo-section">
      <img src="logo_creativesouls.jpg" alt="Creative Souls 3D Logo" />
      <span>Creative Souls 3D</span>
    </div>
    <nav class="cart-link" aria-label="Main navigation">
      <a href="index.html">Shop</a>
      <a href="orders.html">Orders</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main class="track-shell">
    <div id="track-info"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script src="navigation.js"></script>

  <script>
    function formatPrice(value) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      }).format(Number(value || 0));
    }

    function normalizeOrderId(value) {
      const cleaned = String(value || "").trim().replace(/^#/, "");
      return cleaned ? `#${cleaned}` : null;
    }

    function getOrderId() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      return normalizeOrderId(id);
    }

    function showTrackForm(message = "") {
      const container = document.getElementById("track-info");
      container.innerHTML = `
        <div class="track-card">
          <form id="track-form" class="track-form">
            <div>
              <h1>Track Your Order</h1>
              <p>Enter your order ID to see the latest status and delivery details.</p>
            </div>
            <div class="track-input-row">
              <input id="order-id-input" type="text" placeholder="Example: 253751" autocomplete="off" required />
              <button type="submit">Track</button>
            </div>
            <p id="track-message" class="error">${message}</p>
          </form>
        </div>
      `;

      document.getElementById("track-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const orderId = normalizeOrderId(document.getElementById("order-id-input").value);

        if (!orderId) {
          document.getElementById("track-message").textContent = "Please enter an order ID.";
          return;
        }

        const cleanId = orderId.replace("#", "");
        window.history.replaceState(null, "", `track-order.html?id=${encodeURIComponent(cleanId)}`);
        loadOrder(orderId);
      });
    }

    function maskPhone(phone) {
      if (!phone || phone.length < 4) return phone;
      return phone.slice(0, 2) + "XXXXXX" + phone.slice(-2);
    }

    function getProgressIndex(status) {
      if (!status) return 0;
      const normalized = status.toLowerCase();
      if (normalized.includes("placed")) return 0;
      if (normalized.includes("approved")) return 1;
      if (normalized.includes("rejected")) return 1;
      if (normalized.includes("printing")) return 2;
      if (normalized.includes("delivery") && !normalized.includes("delivered")) return 3;
      if (normalized.includes("delivered")) return 4;
      return 0;
    }

    async function loadOrder(orderId = getOrderId()) {
      const container = document.getElementById("track-info");

      if (!orderId) {
        showTrackForm();
        return;
      }

      container.innerHTML = "<div class='loading'>Loading order details...</div>";

      try {
        const doc = await db.collection("orders").doc(orderId).get();

        if (!doc.exists) {
          showTrackForm("Order not found. Please check the order ID and try again.");
          return;
        }

        const data = doc.data();
        const statusText = data.status ? data.status.toLowerCase() : "";
        const currentStep = getProgressIndex(statusText);
        const isRejected = statusText.includes("rejected");
        const isWaitingPayment = statusText.includes("waiting for payment");
        const steps = ["Order Placed", "Order Approved", "Printing Product", "Put For Delivery", "Product Delivered"];
        let stepsHTML = "";

        steps.forEach((step, index) => {
          let className = "";
          if (isRejected) {
            if (index <= 1) className = "rejected";
          } else if (index < currentStep) {
            className = "completed";
          } else if (index === currentStep) {
            className = "active";
          }

          stepsHTML += `
            <div class="step ${className}">
              <div class="circle">${index + 1}</div>
              <span>${step}</span>
            </div>
          `;
        });

        const progressWidth = (currentStep / (steps.length - 1)) * 100;
        let itemsHTML = "";

        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            itemsHTML += `
              <li>
                <strong>${item.productName || "Untitled product"}</strong><br>
                Qty: ${item.quantity} &times; ${formatPrice(item.price)}<br>
                Subtotal: ${formatPrice(Number(item.quantity || 0) * Number(item.price || 0))}
              </li>
            `;
          });
        }

        container.innerHTML = `
          <div class="track-card">
            <h1>Order ${data.order_id || ""}</h1>
            <div class="status-badge ${
              isRejected ? "rejected" :
              statusText.includes("approved") ? "approved" :
              "pending"
            }">${data.status || "Processing"}</div>

            ${isWaitingPayment ? `
              <div class="empty-state">Payment pending. Please complete your payment to process the order.</div>
            ` : ""}

            <div class="progress-container">
              <div class="progress ${isRejected ? "rejected-bar" : ""}"
                   style="${isRejected ? "" : "width:" + progressWidth + "%"}"></div>
              ${stepsHTML}
            </div>

            <p><span class="label">Placed on:</span> ${data.timestamp ? data.timestamp.toDate().toLocaleString("en-IN") : "-"}</p>
            <p><span class="label">Expected Delivery:</span> ${data.expected_delivery || "Will be updated after payment"}</p>
            <hr>
            <p><span class="label">Phone:</span> ${maskPhone(data.phone || "")}</p>
            <p><span class="label">Delivery Address:</span> ${data.address || ""}</p>
            <hr>
            <h3>Products Ordered</h3>
            <ul>${itemsHTML}</ul>
            <hr>
            <p><span class="label">Item Total:</span> ${formatPrice(data.item_total)}</p>
            ${data.discount && data.discount > 0 ? `<p><span class="label">Discount:</span> - ${formatPrice(data.discount)}</p>` : ""}
            <p><span class="label">Delivery Charge:</span> ${formatPrice(data.delivery_charge)}</p>
            <h3>Total Payable: ${formatPrice(data.total)}</h3>
          </div>
        `;

        if (window.innerWidth <= 768 && !isRejected) {
          const progress = document.querySelector(".progress");
          if (progress) progress.style.height = progressWidth + "%";
        }
      } catch (error) {
        console.error(error);
        container.innerHTML = "<p class='error'>Error loading order.</p>";
      }
    }

    loadOrder();
  </script>
</body>
</html>

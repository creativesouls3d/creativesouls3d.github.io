<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | Creative Souls 3D</title>

  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script defer src="cart.js"></script>
</head>

<body>
  <header>
    <button class="back-nav" type="button" data-back data-fallback="index.html">&larr; Back</button>
    <div class="logo-section">
      <img src="logo_creativesouls.jpg" alt="Creative Souls 3D Logo" />
      <span>Creative Souls 3D</span>
    </div>
    <nav class="cart-link" aria-label="Main navigation">
      <a href="index.html">Shop</a>
      <a href="orders.html">Orders</a>
      <a href="account.html">Account</a>
    </nav>
  </header>

  <main>
    <section class="account-section">
      <h1>Your Cart</h1>
      <p>Review your custom items before placing the order.</p>
    </section>

    <div id="cart-items"></div>
    <div id="cart-summary" class="cart-summary"></div>

    <div class="coupon-row">
      <input type="text" id="coupon" placeholder="Enter coupon code (optional)" />
      <button onclick="applyCoupon()">Apply</button>
    </div>
    <p id="coupon-message" style="max-width:900px;margin:8px auto 0;font-weight:700;"></p>

    <div style="text-align:center; margin-bottom: 50px;">
      <button id="place-order" style="display:inline-block;">Place Order</button>
      <p id="order-message" style="margin-top:20px;font-weight:800;"></p>
    </div>
  </main>

  <footer>
    <p>Creative Souls 3D &copy; 2026 - Custom 3D Printed Gifts & Art</p>
  </footer>
  <script src="navigation.js"></script>
</body>
</html>

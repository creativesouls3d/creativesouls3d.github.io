<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart | Creative Souls 3D</title>

  <link rel="icon" type="image/png" href="logo_creativesouls.jpg">
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script defer src="cart.js"></script>
</head>

<body>
  <!-- Header -->
  <header>
    <button class="back-nav" type="button" data-back data-fallback="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back
    </button>
    <div class="logo-section" onclick="window.location.href='index.html'">
      <img src="logo_creativesouls.jpg" alt="Creative Souls 3D Logo" />
      <span>Creative Souls <strong>3D</strong></span>
    </div>
    <nav class="cart-link" aria-label="Main navigation">
      <a href="index.html" class="nav-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Shop
      </a>
      <a href="orders.html" class="nav-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        Orders
      </a>
      <a href="account.html" class="nav-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Account
      </a>
    </nav>
  </header>

  <main>
    <div style="width: min(1040px, calc(100% - 32px)); margin: 32px auto 8px;">
      <h1 style="font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; color: var(--text-primary);">Your Cart</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Review your custom 3D printed items before placing your order.</p>
    </div>

    <div class="cart-layout">
      <!-- Left Column: Items List -->
      <section>
        <div id="cart-items">
          <div class="empty-state">
            <p>Loading your cart...</p>
          </div>
        </div>
      </section>

      <!-- Right Column: Summary & Checkout -->
      <aside>
        <div id="cart-summary" class="cart-summary">
          <h2>Order Summary</h2>
          <div style="color: var(--text-muted); font-size: 0.9rem;">Checking user details & calculating total...</div>
        </div>

        <div style="background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 24px; margin-top: 16px; box-shadow: var(--shadow-sm);">
          <label for="coupon" style="font-size: 0.88rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">
            Have a Promo Code?
          </label>
          <div class="coupon-row" style="margin: 0;">
            <input type="text" id="coupon" placeholder="Enter coupon code" />
            <button type="button" onclick="applyCoupon()">Apply</button>
          </div>
          <p id="coupon-message" style="margin-top: 8px; font-size: 0.85rem; font-weight: 700;"></p>
        </div>

        <div style="margin-top: 16px;">
          <label class="order-note-field" for="order-note">
            <strong>Note for your order (optional)</strong>
            <span>Share any delivery or order instructions.</span>
            <textarea id="order-note" rows="3" maxlength="1000" placeholder="Add a note for this order"></textarea>
          </label>
          <button id="place-order">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Place Order (Cash on Delivery)
          </button>
          <p id="order-message" style="margin-top: 16px; text-align: center; font-weight: 800; font-size: 0.95rem;"></p>
        </div>
      </aside>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>Creative Souls 3D &copy; 2026 &bull; Personalized 3D Printed Art, Gifts & Keepsakes</p>
  </footer>

  <script src="navigation.js"></script>
  <script src="site-footer.js"></script>
</body>
</html>

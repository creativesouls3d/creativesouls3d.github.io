<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Orders | Creative Souls 3D</title>

  <link rel="icon" type="image/png" href="logo_creativesouls.jpg">
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script defer src="orders.js"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <button class="back-nav" type="button" data-back data-fallback="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back
    </button>
    <div class="logo-section" onclick="window.location.href='index.html'">
      <img src="logo_creativesouls.jpg" alt="Creative Souls 3D Logo" />
      <span>Creative Souls <strong>3D</strong></span>
    </div>
    <nav class="cart-link" aria-label="Main navigation">
      <a href="index.html" class="nav-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Shop
      </a>
      <a href="cart.html" class="nav-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Cart
        <span class="cart-badge" id="cart-badge">0</span>
      </a>
      <a href="account.html" class="nav-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Account
      </a>
    </nav>
  </header>

  <main>
    <div style="max-width: 900px; margin: 32px auto 16px; padding: 0 4px;">
      <h1 style="font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; color: var(--text-primary);">Your Orders</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Track real-time progress, print status, and delivery schedules for your custom orders.</p>
    </div>
    
    <div id="orders-list" class="order-list">
      <div class="empty-state">
        <p>Loading your orders...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>Creative Souls 3D &copy; 2026 &bull; Personalized 3D Printed Art, Gifts & Keepsakes</p>
  </footer>

  <script src="navigation.js"></script>
  <script src="site-footer.js"></script>
</body>
</html>

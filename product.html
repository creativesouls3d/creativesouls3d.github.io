<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product | Creative Souls 3D</title>

  <meta name="description" content="View product details from Creative Souls 3D." />
  <link rel="icon" type="image/png" href="logo_creativesouls.jpg">
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    .product-container {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.85fr);
      gap: clamp(24px, 5vw, 48px);
      align-items: center;
      width: min(1100px, calc(100% - 32px));
      margin: 46px auto 72px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }

    .product-image img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--soft);
    }

    .product-details h1 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .product-price {
      margin: 16px 0;
      color: var(--brand-dark);
      font-size: 1.6rem;
      font-weight: 900;
    }

    .product-description {
      color: var(--muted);
      margin-bottom: 26px;
    }

    .product-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .product-buttons button {
      padding: 12px 20px;
    }

    #back-btn {
      background: var(--ink);
      color: #fff6cf;
    }

    .loading,
    .error-message {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 1.15rem;
      font-weight: 800;
    }

    .reviews-section {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto 72px;
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.2fr);
      gap: 18px;
      clear: both;
    }

    .review-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 8px 24px rgba(39, 31, 13, 0.07);
    }

    .review-panel h2 {
      margin-bottom: 8px;
      font-size: 1.25rem;
    }

    .review-summary {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 12px 0 18px;
    }

    .review-summary strong {
      color: var(--brand-dark);
      font-size: 2rem;
      line-height: 1;
    }

    .review-form {
      display: grid;
      gap: 12px;
    }

    .review-form textarea,
    .review-form select {
      width: 100%;
      min-height: 46px;
      padding: 11px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .review-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .review-form button,
    #review-login-btn {
      min-height: 42px;
      background: var(--brand);
      border: none;
      border-radius: var(--radius);
      color: var(--ink);
      cursor: pointer;
      font-weight: 900;
    }

    .review-message {
      color: var(--muted);
      font-weight: 800;
    }

    .reviews-list {
      display: grid;
      gap: 12px;
    }

    .review-card {
      padding: 14px;
      background: #fffcf4;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .review-card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .review-rating {
      color: var(--brand-dark);
      font-weight: 900;
      white-space: nowrap;
    }

    .review-date {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .product-container {
        grid-template-columns: 1fr;
      }

      .reviews-section {
        grid-template-columns: 1fr;
        margin-top: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <button class="back-nav" type="button" data-back data-fallback="index.html">&larr; Back</button>
    <div class="logo-section">
      <img src="logo_creativesouls.jpg" alt="Creative Souls 3D Logo" />
      <span>Creative Souls 3D</span>
    </div>

    <nav class="cart-link" aria-label="Main navigation">
      <a href="index.html">Shop</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <div id="loading" class="loading">Loading product...</div>

  <div id="error" class="error-message" style="display:none;">
    Product not found.
  </div>

  <div id="product-section" class="product-container" style="display:none;">
    <div class="product-image">
      <img id="product-image" src="" alt="Product image">
    </div>

    <div class="product-details">
      <span class="eyebrow" id="product-category">Product</span>
      <h1 id="product-name"></h1>
      <div class="product-price" id="product-price"></div>
      <p class="product-description" id="product-description"></p>

      <div class="product-buttons">
        <button id="add-to-cart">Add to Cart</button>
        <button id="back-btn">Back</button>
      </div>
    </div>
  </div>

  <section id="reviews-section" class="reviews-section" style="display:none;">
    <article class="review-panel">
      <h2>Customer Reviews</h2>
      <p>Share your experience with this product.</p>
      <div id="review-summary" class="review-summary">
        <strong>0/5</strong>
        <span>No reviews yet</span>
      </div>

      <div id="review-auth-message" class="review-message">Login to write a review.</div>
      <button id="review-login-btn" type="button" style="display:none;">Login with Google</button>

      <form id="review-form" class="review-form" style="display:none;">
        <label>
          Rating
          <select id="review-rating" required>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Good</option>
            <option value="3">3 - Average</option>
            <option value="2">2 - Poor</option>
            <option value="1">1 - Very Poor</option>
          </select>
        </label>
        <label>
          Comment
          <textarea id="review-comment" placeholder="Tell customers what you liked about this product." required></textarea>
        </label>
        <button type="submit">Submit Review</button>
        <p id="review-message" class="review-message"></p>
      </form>
    </article>

    <article class="review-panel">
      <h2>What Customers Say</h2>
      <div id="reviews-list" class="reviews-list">
        <div class="empty-state">Loading reviews...</div>
      </div>
    </article>
  </section>

  <footer>
    <p>Creative Souls 3D &copy; 2026 - Personalized 3D Printed Art, Gifts & More</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="navigation.js"></script>

  <script>
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
    const productSection = document.getElementById("product-section");
    const addToCartBtn = document.getElementById("add-to-cart");
    const reviewsSection = document.getElementById("reviews-section");
    const reviewSummary = document.getElementById("review-summary");
    const reviewsList = document.getElementById("reviews-list");
    const reviewForm = document.getElementById("review-form");
    const reviewRating = document.getElementById("review-rating");
    const reviewComment = document.getElementById("review-comment");
    const reviewMessage = document.getElementById("review-message");
    const reviewAuthMessage = document.getElementById("review-auth-message");
    const reviewLoginBtn = document.getElementById("review-login-btn");
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get("id");
    let currentProduct = null;
    let currentUser = null;
    let currentUserPurchasedProduct = false;

    function formatPrice(value) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      }).format(Number(value || 0));
    }

    function escapeHTML(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatReviewDate(timestamp) {
      if (!timestamp) return "";
      return new Date(Number(timestamp)).toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function getReviewsRef() {
      return db.collection("products").doc(productId).collection("reviews");
    }

    function orderContainsProduct(order) {
      return (order.items || []).some(item => {
        const itemId = String(item.id || item.productId || "");
        return itemId === productId;
      });
    }

    async function hasPurchasedProduct(user) {
      if (!user || !productId) return false;

      const snapshot = await db.collection("orders")
        .where("email", "==", user.email)
        .get();

      return snapshot.docs.some(doc => orderContainsProduct(doc.data()));
    }

    function renderReviews(reviews) {
      if (reviews.length === 0) {
        reviewSummary.innerHTML = "<strong>0/5</strong><span>No reviews yet</span>";
        reviewsList.innerHTML = "<div class='empty-state'>No reviews yet. Be the first to review this product.</div>";
        return;
      }

      const total = reviews.reduce((sum, review) => sum + Number(review.rating || 0), 0);
      const average = (total / reviews.length).toFixed(1);
      reviewSummary.innerHTML = `<strong>${average}/5</strong><span>${reviews.length} review${reviews.length === 1 ? "" : "s"}</span>`;

      reviewsList.innerHTML = reviews.map(review => `
        <div class="review-card">
          <div class="review-card-header">
            <div>
              <strong>${escapeHTML(review.userName || "Customer")}</strong>
              <div class="review-date">${escapeHTML(formatReviewDate(review.timestamp))}</div>
            </div>
            <div class="review-rating">${Number(review.rating || 0)}/5</div>
          </div>
          <p>${escapeHTML(review.comment || "")}</p>
        </div>
      `).join("");
    }

    async function loadReviews() {
      if (!productId) return;

      try {
        const snapshot = await getReviewsRef().orderBy("timestamp", "desc").get();
        const reviews = [];
        snapshot.forEach(doc => reviews.push(doc.data()));
        renderReviews(reviews);

        if (currentUser) {
          const ownReview = reviews.find(review => review.email === currentUser.email);
          if (ownReview) {
            reviewRating.value = String(ownReview.rating || 5);
            reviewComment.value = ownReview.comment || "";
            reviewMessage.textContent = "You can update your existing review.";
          }
        }
      } catch (err) {
        console.error("Error loading reviews:", err);
        reviewsList.innerHTML = "<div class='empty-state'>Unable to load reviews right now.</div>";
      }
    }

    firebase.auth().onAuthStateChanged(async (user) => {
      currentUser = user;
      currentUserPurchasedProduct = false;

      if (user) {
        reviewLoginBtn.style.display = "none";
        reviewForm.style.display = "none";
        reviewAuthMessage.textContent = "Checking your purchase history...";

        try {
          currentUserPurchasedProduct = await hasPurchasedProduct(user);

          if (currentUserPurchasedProduct) {
            reviewAuthMessage.textContent = `Reviewing as ${user.displayName || user.email}`;
            reviewForm.style.display = "grid";
          } else {
            reviewAuthMessage.textContent = "Only customers who purchased this product can write a review.";
          }

          loadReviews();
        } catch (err) {
          console.error("Error checking purchase history:", err);
          reviewAuthMessage.textContent = "Could not verify your purchase history right now.";
        }
      } else {
        reviewAuthMessage.textContent = "Login to write a review.";
        reviewLoginBtn.style.display = "block";
        reviewForm.style.display = "none";
      }
    });

    reviewLoginBtn.addEventListener("click", () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider).catch(err => {
        reviewAuthMessage.textContent = "Login failed: " + err.message;
      });
    });

    if (!productId) {
      loading.style.display = "none";
      error.style.display = "block";
    } else {
      db.collection("products").doc(productId).get()
        .then(doc => {
          if (!doc.exists) {
            loading.style.display = "none";
            error.style.display = "block";
            return;
          }

          const data = doc.data();
          currentProduct = { id: productId, ...data };

          document.getElementById("product-image").src = data.imageUrl || "logo_creativesouls.jpg";
          document.getElementById("product-name").textContent = data.productName || "Untitled product";
          document.getElementById("product-price").textContent = formatPrice(data.price);
          document.getElementById("product-description").textContent = data.description || "A custom Creative Souls 3D product.";
          document.getElementById("product-category").textContent = data.category || "Product";

          loading.style.display = "none";
          productSection.style.display = "grid";
          reviewsSection.style.display = "grid";
          loadReviews();
        })
        .catch(err => {
          console.error("Error loading product:", err);
          loading.style.display = "none";
          error.style.display = "block";
        });
    }

    addToCartBtn.addEventListener("click", () => {
      if (!currentProduct) return;

      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      const existing = cart.find(item => item.id === productId);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: productId,
          productName: currentProduct.productName || "Untitled product",
          imageUrl: currentProduct.imageUrl || "",
          price: Number(currentProduct.price || 0),
          quantity: 1
        });
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      addToCartBtn.textContent = "Added to Cart";
      setTimeout(() => {
        addToCartBtn.textContent = "Add to Cart";
      }, 1400);
    });

    document.getElementById("back-btn").addEventListener("click", () => {
      goBackOrHome("index.html");
    });

    reviewForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!currentUser) {
        reviewMessage.textContent = "Please login to submit a review.";
        return;
      }

      if (!currentUserPurchasedProduct) {
        reviewMessage.textContent = "Only customers who purchased this product can write a review.";
        return;
      }

      const comment = reviewComment.value.trim();
      const rating = Number(reviewRating.value);

      if (!comment || rating < 1 || rating > 5) {
        reviewMessage.textContent = "Please add a rating and comment.";
        return;
      }

      reviewMessage.textContent = "Saving review...";

      try {
        await getReviewsRef().doc(currentUser.email).set({
          comment,
          email: currentUser.email,
          ownReview: false,
          rating,
          timestamp: Date.now(),
          userName: currentUser.displayName || currentUser.email
        });

        reviewMessage.textContent = "Review saved successfully.";
        loadReviews();
      } catch (err) {
        console.error("Error saving review:", err);
        reviewMessage.textContent = "Could not save review. Please try again.";
      }
    });
  </script>
</body>
</html>
